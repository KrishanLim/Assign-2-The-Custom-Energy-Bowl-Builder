<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Bowl Builder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Build Your Energy Bowl</h1>
        <p>Pick your base, fruits and toppings and we'll make it fresh for you!</p>
    </header>

    <main>
        <form id="bowlForm" novalidate>

            <!-- Size -->
            <fieldset>
                <legend>Bowl Size</legend>
                <label><input type="radio" name="size" value="Small"> Small</label>
                <label><input type="radio" name="size" value="Medium" checked> Medium</label>
                <label><input type="radio" name="size" value="Large"> Large</label>
            </fieldset>

            <!-- Base -->
            <fieldset>
                <legend>Choose a Base</legend>
                <select id="base" name="base" aria-label="Base">
                    <option value="">-- Select a base --</option>
                    <option value="Acai">Acai</option>
                    <option value="Greek Yogurt">Greek Yogurt</option>
                    <option value="Oatmeal">Oatmeal</option>
                    <option value="Chia Pudding">Chia Pudding</option>
                    <option value="Pitaya">Pitaya (Dragon Fruit)</option>
                </select>
            </fieldset>

            <!-- Fruits -->
            <fieldset>
                <legend>Fruits</legend>
                <label><input type="checkbox" name="fruits" value="Banana"> Banana</label>
                <label><input type="checkbox" name="fruits" value="Strawberries"> Strawberries</label>
                <label><input type="checkbox" name="fruits" value="Blueberries"> Blueberries</label>
                <label><input type="checkbox" name="fruits" value="Mango"> Mango</label>
                <label><input type="checkbox" name="fruits" value="Kiwi"> Kiwi</label>
                <label><input type="checkbox" name="fruits" value="Pineapple"> Pineapple</label>
            </fieldset>

            <!-- Toppings -->
            <fieldset>
                <legend>Toppings <span class="hint">(up to 3)</span></legend>
                <label><input type="checkbox" name="toppings" value="Granola"> Granola</label>
                <label><input type="checkbox" name="toppings" value="Coconut Flakes"> Coconut Flakes</label>
                <label><input type="checkbox" name="toppings" value="Almonds"> Almonds</label>
                <label><input type="checkbox" name="toppings" value="Chia Seeds"> Chia Seeds</label>
                <label><input type="checkbox" name="toppings" value="Pumpkin Seeds"> Pumpkin Seeds</label>
                <label><input type="checkbox" name="toppings" value="Cacao Nibs"> Cacao Nibs</label>
            </fieldset>

            <!-- Protein add-on -->
            <fieldset>
                <legend>Protein Add-on</legend>
                <select id="protein" name="protein" aria-label="Protein add-on">
                    <option value="None">None</option>
                    <option value="Whey Protein">Whey Protein</option>
                    <option value="Plant Protein">Plant Protein</option>
                    <option value="Peanut Butter">Peanut Butter</option>
                    <option value="Almond Butter">Almond Butter</option>
                </select>
            </fieldset>

            <!-- Sweetener -->
            <fieldset>
                <legend>Sweetener</legend>
                <label><input type="radio" name="sweetener" value="None" checked> None</label>
                <label><input type="radio" name="sweetener" value="Honey"> Honey</label>
                <label><input type="radio" name="sweetener" value="Maple Syrup"> Maple Syrup</label>
                <label><input type="radio" name="sweetener" value="Agave"> Agave</label>
            </fieldset>

            <!-- Special instructions -->
            <fieldset>
                <legend>Special Instructions</legend>
                <textarea id="instructions" name="instructions" rows="3" maxlength="150"
                          aria-label="Special instructions" placeholder="Allergies, extra stuff, etc."></textarea>
            </fieldset>

            <button type="submit">Place Order</button>

        </form>

        <!-- order summary / errors show up here -->
        <section id="orderOutput" aria-live="polite"></section>
    </main>

    <footer>
        <p>&copy; 2026 Energy Bowl Builder</p>
    </footer>

    <script src="js/energyBowl.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
